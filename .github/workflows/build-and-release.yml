name: Build Standalone Windows Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build Standalone Executable (.exe) and Package Zip
        run: |
          python build_exe.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ananya_Invoice_Automation_Windows
          path: dist/Ananya_Invoice_Automation_Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Ananya_Invoice_Automation_Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
