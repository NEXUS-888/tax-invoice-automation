name: Build Standalone Windows Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build Standalone Executable (.exe) and Package Zip
        run: |
          python build_exe.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ananya_Invoice_Automation_Windows
          path: |
            dist/Ananya_Invoice_Automation_Setup.exe
            dist/Ananya_Invoice_Automation_Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Ananya_Invoice_Automation_Setup.exe
            dist/Ananya_Invoice_Automation_Windows.zip
          draft: false
          prerelease: false
          name: "Release ${{ github.ref_name }}: 1-Click Windows Setup & Tax Invoice Automation"
          body: |
            ## 🚀 Ananya Enterprises - Invoice Automation & WhatsApp Dispatcher ${{ github.ref_name }}

            ### 📥 Direct Downloads
            - 🔹 [**Click here to Download Ananya_Invoice_Automation_Setup.exe**](https://github.com/NEXUS-888/tax-invoice-automation/releases/download/${{ github.ref_name }}/Ananya_Invoice_Automation_Setup.exe) *(Recommended: 1-Click Installer & Updater)*
            - 📦 [**Click here to Download Ananya_Invoice_Automation_Windows.zip**](https://github.com/NEXUS-888/tax-invoice-automation/releases/download/${{ github.ref_name }}/Ananya_Invoice_Automation_Windows.zip) *(Standalone portable zip archive)*

            ---

            ### ✨ What's Included:
            - 🔄 **Smart Installer & Updater:** Automatically detects existing installations and updates in-place while safeguarding all saved agencies, rates, loads, WhatsApp session, and Excel data.
            - 🛡️ **Engine Stability Fix:** Added compatibility shims for openpyxl and numpy preventing startup exceptions.
            - 📋 **Native Windows `CF_HDROP` Clipboard Attachment:** Reliable Ctrl+V PDF attachment for WhatsApp Desktop and Web.
            - 📄 **Automated PDF Billing:** Complete ReportLab invoice generation with mandatory payment reminder.
            - ✏️ **Agency Profile & Load Management:** Custom rates, loads, PAN, GST, and WhatsApp phone numbers with persistent storage.
            - 📱 **Dual WhatsApp Dispatch:** Direct app share with clipboard attachment & automated batch dispatcher.
